name: Create Stable Release

on: [ push, pull_request ]

# for release create
permissions:
  contents: write

env:
  APP_TRIPLE: x86_64-pc-freebsd12-elf
  BUILTINS_TRIPLE: x86_64-scei-ps4
  SYSROOT: ${{ github.workspace }}/OpenOrbis-PS4-Toolchain

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get install -y ninja-build

    - name: Install LLVM and Clang (21)
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: 21
        directory: ${{ runner.tool_cache }}/llvm

    - name: Fetch toolchain headers
      uses: actions/checkout@v4
      with:
        repository: StevenMiller123/OpenOrbis-PS4-Toolchain
        path: OpenOrbis-PS4-Toolchain

    - name: Fetch musl
      run: curl -sL https://github.com/StevenMiller123/musl-openorbis/releases/latest/download/musl.tar.gz | tar xz -C ./OpenOrbis-PS4-Toolchain

    - name: Build compiler-rt builtins
      run: |
        cmake -S compiler-rt/lib/builtins -B build/builtins -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER=clang -DCMAKE_ASM_COMPILER=clang \
        -DCMAKE_AR="$(command -v llvm-ar)" -DCMAKE_RANLIB="$(command -v llvm-ranlib)" \
        -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_SYSTEM_NAME=Generic \
        -DCMAKE_C_COMPILER_TARGET="$BUILTINS_TRIPLE" -DCMAKE_ASM_COMPILER_TARGET="$BUILTINS_TRIPLE" \
        -DCMAKE_C_FLAGS="-fPIC -DPS4 -isystem $SYSROOT/include" -DCMAKE_ASM_FLAGS="-fPIC -DPS4" \
        -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=OFF -DCOMPILER_RT_OS_DIR=ps4 \
        -DCOMPILER_RT_BAREMETAL_BUILD=ON -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON
        ninja -C build/builtins

    - name: Build libunwind, libc++abi and libc++
      run: |
        flags="-fPIC -DPS4 -isystem $SYSROOT/include"
        cmake -S runtimes -B build/runtimes -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_ASM_COMPILER=clang \
        -DCMAKE_AR="$(command -v llvm-ar)" -DCMAKE_RANLIB="$(command -v llvm-ranlib)" \
        -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
        -DCMAKE_SYSTEM_NAME=FreeBSD -DCMAKE_SYSROOT="$SYSROOT" \
        -DCMAKE_C_COMPILER_TARGET="$APP_TRIPLE" -DCMAKE_CXX_COMPILER_TARGET="$APP_TRIPLE" \
        -DCMAKE_ASM_COMPILER_TARGET="$APP_TRIPLE" \
        -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_ASM_FLAGS="$flags" \
        -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/out" \
        -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=OFF \
        -DLLVM_ENABLE_RUNTIMES="libunwind;libcxxabi;libcxx" \
        -DLIBUNWIND_ENABLE_SHARED=OFF -DLIBUNWIND_ENABLE_STATIC=ON \
        -DLIBUNWIND_IS_BAREMETAL=ON -DLIBUNWIND_USE_COMPILER_RT=ON -DLIBUNWIND_INCLUDE_TESTS=OFF \
        -DLIBCXXABI_ENABLE_SHARED=OFF -DLIBCXXABI_ENABLE_STATIC=ON -DLIBCXXABI_ENABLE_EXCEPTIONS=ON \
        -DLIBCXXABI_USE_LLVM_UNWINDER=ON -DLIBCXXABI_USE_COMPILER_RT=ON -DLIBCXXABI_INCLUDE_TESTS=OFF \
        -DLIBCXXABI_HAS_CXA_THREAD_ATEXIT_IMPL=OFF \
        -DLIBCXX_ENABLE_SHARED=OFF -DLIBCXX_ENABLE_STATIC=ON -DLIBCXX_CXX_ABI=libcxxabi \
        -DLIBCXX_ENABLE_STATIC_ABI_LIBRARY=OFF -DLIBCXX_HAS_MUSL_LIBC=ON -DLIBCXX_HAS_PTHREAD_API=ON \
        -DLIBCXX_USE_COMPILER_RT=ON -DLIBCXX_ENABLE_TIME_ZONE_DATABASE=OFF \
        -DLIBCXX_INCLUDE_TESTS=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF -DLIBCXX_INSTALL_MODULES=OFF
        ninja -C build/runtimes
        ninja -C build/runtimes install

    - name: Copy libs and headers
      run: |
        mkdir -p release/lib
        mkdir -p release/include
        cp "$(find build/builtins -name 'libclang_rt.builtins*.a' | head -1)" release/lib/libclang_rt.builtins-x86_64.a
        cp out/lib/*.a release/lib/
        cp -r out/include/* release/include/

    - name: Create master libc++ archive
      working-directory: release/lib
      run: |
        echo "CREATE libc++M.a"    > mri.txt
        echo "ADDLIB libunwind.a" >> mri.txt
        echo "ADDLIB libc++abi.a" >> mri.txt
        echo "ADDLIB libc++.a"    >> mri.txt
        echo "SAVE"               >> mri.txt
        echo "END"                >> mri.txt
        llvm-ar -M < mri.txt && rm mri.txt && rm libc++.a && mv libc++M.a libc++.a

    - name: Create tarball
      working-directory: release
      run: tar -czf libcxx-full.tar.gz lib/* include/*

    - name: Create Release
      working-directory: release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create release-${{ GITHUB.SHA }} libcxx-full.tar.gz --target ${{ GITHUB.SHA }} -t "Automated Release ${{ GITHUB.SHA }}"
